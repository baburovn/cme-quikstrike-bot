# Nginx Virtual Host for CME Metals Telegram Mini App
# Replace cme.yourdomain.com with your actual domain/subdomain

server {
    listen 80;
    server_name cme.bbrv.ru;

    # Redirect all HTTP to HTTPS (Telegram Mini Apps require HTTPS!)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cme.bbrv.ru;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cme.bbrv.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cme.bbrv.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to FastAPI / Static WebApp
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Real-Time Stream
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
